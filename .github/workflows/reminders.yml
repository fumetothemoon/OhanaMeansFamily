name: OhanaMeansFamily reminders

# 時間都是 UTC，台灣時間 = UTC + 8
#   週一 16:37 台灣 -> 週一 08:37 UTC
#   週三 16:37 台灣 -> 週三 08:37 UTC
#   週日 16:37 台灣 -> 週日 08:37 UTC
#   每月 1 號 08:37 台灣 -> 每月 1 號 00:37 UTC
#   排程刻意避開整點（:37），因為 GitHub 在整點排程最擁擠，常延遲數分鐘到數小時（#12）。
#   Schedules avoid the top of the hour on purpose: GitHub delays on-the-hour cron runs the most (#12).
on:
  schedule:
    - cron: "37 8 * * 1" # 週一 16:37 台灣時間：本週任務清單
    - cron: "37 8 * * 3" # 週三 16:37 台灣時間：週間提醒
    - cron: "37 8 * * 0" # 週日 16:37 台灣時間：週末提醒
    - cron: "37 0 1 * *" # 每月 1 號 08:37 台灣時間：待辦清單提醒
  workflow_dispatch: # 也可以手動到 GitHub 上按按鈕測試觸發
    inputs:
      job:
        description: "要測試哪一個提醒"
        required: true
        default: "weekly-kickoff"
        type: choice
        options:
          - weekly-kickoff
          - midweek
          - weekend
          - monthly-todo

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 判斷這次要打哪一個端點
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            cron="${{ github.event.schedule }}"
            case "$cron" in
              "37 8 * * 1") echo "path=weekly-kickoff" >> "$GITHUB_OUTPUT" ;;
              "37 8 * * 3") echo "path=midweek" >> "$GITHUB_OUTPUT" ;;
              "37 8 * * 0") echo "path=weekend" >> "$GITHUB_OUTPUT" ;;
              "37 0 1 * *") echo "path=monthly-todo" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: 呼叫機器人觸發端點
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/cron/${{ steps.decide.outputs.path }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --fail
